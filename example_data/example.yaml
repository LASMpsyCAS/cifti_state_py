# Configuration for the bundled example data.
#
# Self-contained on purpose: no `extends`, so it behaves identically on Windows
# and Linux and can be read top to bottom as a complete worked configuration.
# Every relative path below is resolved against THIS file's directory, so the
# repository can be cloned anywhere.
#
#     cifti-state --config example_data/example.yaml check
#     cifti-state --config example_data/example.yaml run \
#         example_data/maps/group_mean_thresh_fdr_E_C.dscalar.nii \
#         --threshold fixed --value 1.039 --extent 20 --out results/E_C
#
# For your own data, do NOT edit this file. Create a machine profile instead:
#
#     cifti-state config --init-machine
#
# which writes configs/machines/<hostname>.yaml extending the platform
# template. See configs/machines/README.md.

# ---- Connectome Workbench ------------------------------------------------ #
# Blank means "search PATH". The example needs Workbench only for the optional
# `wb_command` smoothing step and for opening results in wb_view; clustering,
# reporting and both renderers do not use it at all.
workbench:
  wb_command:
  wb_view:

# ---- Where the template files are ---------------------------------------- #
resources:
  root: fs_LR_32k
  atlas_dir: fs_LR_32k

  surfaces:
    left:
      midthickness: fs_LR.32k.L.midthickness.surf.gii
      inflated:     fs_LR.32k.L.inflated.surf.gii
    right:
      midthickness: fs_LR.32k.R.midthickness.surf.gii
      inflated:     fs_LR.32k.R.inflated.surf.gii

  underlays:
    sulc: fs_LR.32k.LR.sulc.dscalar.nii

  # No neighbour tables are bundled -- see defaults.neighbor_source below.

# ---- Analysis defaults --------------------------------------------------- #
defaults:
  mesh: "32k"
  statistic: z
  direction: positive
  threshold:
    method: fixed         # the example knows the answer at a fixed threshold
    value: 1.039
    q: 0.05
  extent: 20
  atlas: Glasser_2016

  # The MATLAB scripts read lh/rh.neighbors_IndexStart0.txt. Those tables are
  # 2.6 MB and are not bundled; the adjacency derived from the surface mesh was
  # verified to be the identical graph on fs_LR 32k (0 differing entries), and
  # the cluster maps below match MATLAB vertex for vertex either way.
  neighbor_source: surface

  legacy_mode: true       # reproduce the original MATLAB behaviour bit for bit

# ---- Rendering ------------------------------------------------------------ #
render:
  backend: offscreen
  surface: inflated
  layout: grid_4
  colormap: workbench_hot
  dpi: 200
  format: png
  underlay: sulc
  underlay_style: binary
  underlay_orient: auto

runtime:
  n_jobs: 4
  log_level: INFO
