[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cifti-state"
version = "0.1.0"
description = "fsLR 32k surface cluster analysis, anatomical reporting and visualisation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gw" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "nibabel>=5.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
viz = ["surfplot>=0.2", "brainspace>=0.1.10", "vtk>=9.2", "pyvista>=0.43"]
report = ["openpyxl>=3.1"]
gui = ["PySide6>=6.5", "pyvista>=0.43", "pyvistaqt>=0.11"]
dev = ["pytest>=7.4", "pytest-cov"]
all = [
    "surfplot>=0.2", "brainspace>=0.1.10", "vtk>=9.2",
    "pyvista>=0.43", "pyvistaqt>=0.11",
    "openpyxl>=3.1", "tabulate>=0.9",
    "PySide6>=6.5", "pytest>=7.4", "pytest-qt>=4.2",
]

[project.scripts]
cifti-state = "cifti_state.cli:main"

[project.gui-scripts]
cifti-state-gui = "cifti_state.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cifti_state = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_data: needs the fs_LR_32-master / Example_test resources",
    "requires_viz: needs surfplot/vtk",
]
