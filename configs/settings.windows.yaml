# Windows platform template.
#
# This file holds what is the same on every Windows machine: the fs_LR file
# naming convention and the analysis defaults. It deliberately does NOT contain
# any machine-specific path.
#
# Do not edit this file to point at your data. Instead create a machine profile:
#
#     cifti-state config --init-machine
#
# which writes configs/machines/<hostname>.yaml extending this file. See
# configs/machines/README.md.
#
# It is still usable on its own as a last-resort fallback, but with the paths
# below unset an analysis cannot run -- `cifti-state check` will say so.

# ---- Connectome Workbench ------------------------------------------------ #
# Set these in your machine profile. Blank means "search PATH".
# Typical: C:/Program Files/workbench/bin_windows64/wb_command.exe
workbench:
  wb_command:
  wb_view:

resources:
  # Set in your machine profile: the fs_LR_32-master folder.
  root:
  atlas_dir:
  atlas_csv_dir:

  # File names inside resources.root. These follow the standard fs_LR naming
  # and rarely need changing -- override one only if your template pack uses a
  # different name.
  surfaces:
    left:
      midthickness:  fs_LR.32k.L.midthickness.surf.gii
      inflated:      fs_LR.32k.L.inflated.surf.gii
      very_inflated: fs_LR.32k.L.very_inflated.surf.gii
      pial:          fs_LR.32k.L.pial.surf.gii
      white:         fs_LR.32k.L.white.surf.gii
      flat:          fs_LR.32k.L.flat.surf.gii
      sphere:        fs_LR.32k.L.sphere.surf.gii
    right:
      midthickness:  fs_LR.32k.R.midthickness.surf.gii
      inflated:      fs_LR.32k.R.inflated.surf.gii
      very_inflated: fs_LR.32k.R.very_inflated.surf.gii
      pial:          fs_LR.32k.R.pial.surf.gii
      white:         fs_LR.32k.R.white.surf.gii
      flat:          fs_LR.32k.R.flat.surf.gii
      sphere:        fs_LR.32k.R.sphere.surf.gii

  # Greyscale folding pattern drawn beneath the statistic. A relative name is
  # resolved against resources.root, exactly like the surfaces above.
  underlays:
    sulc:      fs_LR.32k.LR.sulc.dscalar.nii
    curvature: fs_LR.32k.LR.curvature.dscalar.nii

  # Pre-computed vertex adjacency (the MATLAB *.neighbors_IndexStart0.txt
  # files). Set the paths in your machine profile. A relative name here is
  # resolved against resources.root.
  #
  # Alternative: set defaults.neighbor_source to "surface" and these are not
  # needed at all -- adjacency is derived from the surface meshes, which was
  # verified to give exactly the same graph on fs_LR 32k.
  neighbors:
    "32k":
      left:  lh.neighbors_IndexStart0.txt
      right: rh.neighbors_IndexStart0.txt
    "10k":
      left:  10Klh.neighbors_IndexStart0.txt
      right: 10krh.neighbors_IndexStart0.txt

# ---- Analysis defaults --------------------------------------------------- #
defaults:
  mesh: "32k"
  statistic: z            # z | t | other   ("t" additionally requires df)
  df:                     # degrees of freedom, only for statistic: t
  direction: positive     # positive | negative | two_sided
  threshold:
    method: fdr           # fixed | fdr | percentile
    value:                # required for method: fixed
    q: 0.05
    percentile: 95.0
  extent: 20              # minimum cluster size in vertices
  atlas: Glasser_2016     # see: cifti-state atlases
  neighbor_source: txt    # txt | surface
  legacy_mode: true       # reproduce the original MATLAB behaviour bit for bit

# ---- Rendering (surfplot) ------------------------------------------------ #
render:
  backend: offscreen      # offscreen | interactive
  surface: inflated
  layout: grid_4          # grid_4 | row_4 | grid_8 | dorsal_ventral
                          # | left_only | right_only | flat
  colormap: workbench_hot
  dpi: 300
  format: png             # png | pdf | svg | tiff
  size: [1200, 800]
  zoom: 1.25
  label_size: 12

  # Sulcal underlay. binary is the Workbench/FreeSurfer look: two flat greys
  # split at zero. continuous keeps the gradient (softer, but a faint overlay
  # is harder to see). Set underlay: none to draw a plain shell.
  underlay: sulc          # sulc | curvature | none
  underlay_style: binary  # binary | continuous
  underlay_orient: auto   # auto | negative | positive -- which sign is a
                          # sulcus. auto measures it against the surface mesh;
                          # set it only if the folding looks inverted.
  underlay_dark: 0.38     # grey for the sulcal side, 0 = black
  underlay_light: 0.72    # grey for the gyral side, 1 = white

# ---- Interface ----------------------------------------------------------- #
# Type is pinned in Python rather than inherited from the desktop, so the same
# build looks the same on every machine. Leave a family blank to let
# cifti_state pick the best one installed (`cifti-state check --fonts`).
#
# If numbers render as the wrong characters, render a specimen with
#     cifti-state check --fonts --sample specimen.png
# then name a family that draws them correctly here.
interface:
  ui_font:                # e.g. Microsoft YaHei UI, Segoe UI
  mono_font:              # e.g. Consolas, Cascadia Mono
  font_size_px: 13        # pixels, so the desktop's DPI setting cannot rescale it
  numeric_font: mono      # mono | ui  -- what the number fields use

runtime:
  tmp_dir:                # set in your machine profile; defaults to the system temp
  n_jobs: 4
  log_level: INFO
