  Schaefer2018_7Networks_600:  { label: "Schaefer 2018, 7 networks, 600 parcels" }
  Schaefer2018_7Networks_700:  { label: "Schaefer 2018, 7 networks, 700 parcels" }
  Schaefer2018_7Networks_800:  { label: "Schaefer 2018, 7 networks, 800 parcels" }
  Schaefer2018_7Networks_900:  { label: "Schaefer 2018, 7 networks, 900 parcels" }
  Schaefer2018_7Networks_1000: { label: "Schaefer 2018, 7 networks, 1000 parcels" }
  Schaefer2018_17Networks_100:  { label: "Schaefer 2018, 17 networks, 100 parcels" }
  Schaefer2018_17Networks_200:  { label: "Schaefer 2018, 17 networks, 200 parcels" }
